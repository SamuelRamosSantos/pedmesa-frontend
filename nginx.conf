# Servidor da SPA (PED-118). Roda como usuário sem privilégios, por isso a porta 8080.
#
# Atenção: no nginx, um add_header dentro de um location descarta os add_header
# herdados do server. Por isso o security-headers.conf é incluído em CADA location.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # O mime.types padrão do nginx não conhece .webmanifest: sem isto o Chrome
    # recebe application/octet-stream, recusa o manifest e o PWA não instala.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fallback da SPA: rotas do React Router devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
