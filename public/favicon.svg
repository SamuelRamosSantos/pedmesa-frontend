<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Laranja (mesma cor do orange-600 do Tailwind usado no resto do app) -->
  <rect width="512" height="512" rx="128" fill="#f54a00"/>

  <g fill="#FFFFFF">
    <!-- Tampo da Mesa no Centro -->
    <rect x="156" y="156" width="200" height="200" rx="36" />

    <!-- Cadeira Superior -->
    <rect x="206" y="100" width="100" height="36" rx="18" opacity="0.9" />
    <!-- Cadeira Inferior -->
    <rect x="206" y="376" width="100" height="36" rx="18" opacity="0.9" />
    <!-- Cadeira Esquerda -->
    <rect x="100" y="206" width="36" height="100" rx="18" opacity="0.9" />
    <!-- Cadeira Direita -->
    <rect x="376" y="206" width="36" height="100" rx="18" opacity="0.9" />
  </g>

  <!-- Check do Pedido vazado no centro em Laranja -->
  <path d="M 210 256 L 240 286 L 302 224" fill="none" stroke="#f54a00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>
