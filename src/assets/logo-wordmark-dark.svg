<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 120" width="100%" height="100%">
  <!-- 1. ÍCONE "MESA INTELIGENTE" (Lado Esquerdo) -->
  <g transform="translate(10, 10)">
    <!-- Fundo Laranja do Ícone -->
    <rect width="100" height="100" rx="26" fill="#f54a00"/>

    <!-- Mesa e Cadeiras -->
    <g fill="#FFFFFF">
      <rect x="30" y="30" width="40" height="40" rx="8" />
      <rect x="40" y="18" width="20" height="8" rx="4" opacity="0.9" />
      <rect x="40" y="74" width="20" height="8" rx="4" opacity="0.9" />
      <rect x="18" y="40" width="8" height="20" rx="4" opacity="0.9" />
      <rect x="74" y="40" width="8" height="20" rx="4" opacity="0.9" />
    </g>

    <!-- Check do Pedido -->
    <path d="M 40 50 L 47 57 L 60 44" fill="none" stroke="#f54a00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 2. TEXTO "PedMesa" (Lado Direito) — variante para fundo escuro, "Ped"+"Mesa" colados -->
  <text x="135" y="85" font-family="'Segoe UI', system-ui, Roboto, Arial, sans-serif" font-size="60" letter-spacing="-1.5"><tspan font-weight="800" fill="#F8FAFC">Ped</tspan><tspan font-weight="700" fill="#f54a00">Mesa</tspan></text>
</svg>
