<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PedMesa</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ea580c" />

    <!-- iOS ignora o manifest — precisa desses meta/link dedicados para instalar
         como app de tela cheia via "Adicionar à Tela de Início" no Safari. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PedMesa" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pedmesa-theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;

          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* localStorage indisponível — mantém o tema claro padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
